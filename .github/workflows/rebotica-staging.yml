name: Rebotica verified staging snapshot
on:
  repository_dispatch:
    types: [salero-rebotica-staging]
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      code_sha:
        required: true
        type: string
      generation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: salero-rebotica-staging-publisher
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.SALERO_REBOTICA_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.identity.outputs.job_id }}
      code_sha: ${{ steps.identity.outputs.code_sha }}
      generation: ${{ steps.identity.outputs.generation }}
    steps:
      - id: identity
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const job=process.env.JOB,code=process.env.CODE,generation=process.env.GENERATION;
          if(!/^[a-z0-9-]{1,80}$/.test(job||'')||!/^[a-f0-9]{40}$/.test(code||'')||code!==process.env.AUTHORIZED_CODE)throw Error('job_identity');
          if(!/^[1-9][0-9]*$/.test(generation||''))throw Error('generation_identity');
          appendFileSync(process.env.GITHUB_OUTPUT,`job_id=${job}\ncode_sha=${code}\ngeneration=${generation}\n`);
          JS
        env:
          JOB: ${{ github.event.client_payload.job_id || inputs.job_id }}
          CODE: ${{ github.event.client_payload.code_sha || inputs.code_sha }}
          GENERATION: ${{ github.event.client_payload.generation || inputs.generation }}
          AUTHORIZED_CODE: ${{ vars.SALERO_CODE_SHA }}
  build:
    needs: prepare
    if: vars.SALERO_REBOTICA_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site: ${{ steps.build.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EugenioAtencia/salerodigital
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --prefix integrations/cloudflare/push-staging --ignore-scripts
      - id: build
        run: node scripts/run-rebotica-staging.mjs
        env:
          SALERO_BUILD_JOB_ID: ${{ needs.prepare.outputs.job_id }}
          SALERO_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          SALERO_CODE_BRANCH: codex/rebotica-editorial-staging
          SALERO_EXPECTED_GENERATION: ${{ needs.prepare.outputs.generation }}
          SALERO_COORDINATOR_URL: ${{ vars.SALERO_COORDINATOR_URL }}
          SALERO_BUILDER_KEY: ${{ secrets.SALERO_BUILDER_KEY }}
          SALERO_SNAPSHOT_KEY: ${{ secrets.SALERO_SNAPSHOT_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: rebotica-${{ needs.prepare.outputs.job_id }}
          path: ${{ steps.build.outputs.site }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  promote:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EugenioAtencia/salerodigital
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --prefix integrations/cloudflare/push-staging --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: rebotica-${{ needs.prepare.outputs.job_id }}
          path: verified-site
      - id: promote
        run: node scripts/promote-rebotica-staging.mjs verified-site
        env:
          SALERO_BUILD_JOB_ID: ${{ needs.prepare.outputs.job_id }}
          SALERO_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          SALERO_COORDINATOR_URL: ${{ vars.SALERO_COORDINATOR_URL }}
          SALERO_PROMOTER_KEY: ${{ secrets.SALERO_PROMOTER_KEY }}
          CLOUDFLARE_ACCOUNT_ID: '0bd72789f683471596f05b6d0c4653fc'
          CLOUDFLARE_API_TOKEN: ${{ secrets.SALERO_STAGING_PAGES_WRITE_TOKEN }}
    outputs:
      deployment_id: ${{ steps.promote.outputs.deployment_id }}
  monitor:
    needs: [prepare, build, promote]
    if: always() && needs.prepare.result == 'success' && vars.SALERO_REBOTICA_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EugenioAtencia/salerodigital
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/confirm-rebotica-staging.mjs
        env:
          SALERO_BUILD_JOB_ID: ${{ needs.prepare.outputs.job_id }}
          SALERO_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          SALERO_COORDINATOR_URL: ${{ vars.SALERO_COORDINATOR_URL }}
          SALERO_MONITOR_KEY: ${{ secrets.SALERO_MONITOR_KEY }}
          SALERO_DEPLOYMENT_ID: ${{ needs.promote.outputs.deployment_id }}
          SALERO_RUN_RESULT: ${{ needs.build.result != 'success' && needs.build.result || needs.promote.result }}
          CLOUDFLARE_ACCOUNT_ID: '0bd72789f683471596f05b6d0c4653fc'
          CLOUDFLARE_API_TOKEN: ${{ secrets.SALERO_STAGING_PAGES_READ_TOKEN }}
